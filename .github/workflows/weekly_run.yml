name: Weekly Notion Refresh

on:
  schedule:
    - cron: '0 12 * * *' # every day @ 4am CST, 5am CDT, 12pm UTC
  workflow_dispatch: # allow manual run

jobs:
  run-notion-refresh:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TASKS_DB_ID: ${{ secrets.TASKS_DB_ID }}
      WEIGHTS_DB_ID: ${{ secrets.WEIGHTS_DB_ID }}
      WHISKER_EMAIL: ${{ secrets.WHISKER_EMAIL }}
      WHISKER_PASSWORD: ${{ secrets.WHISKER_PASSWORD }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # remove after jun 2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Notion Refresh
        run: uv run main.py
